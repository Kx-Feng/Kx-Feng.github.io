<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" data-bg="{{ site.background | default: 'none' }}">
<head>
  {% include head.html %}
  {% seo title=false %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" class="layout{% unless page.sidebar %} layout--wide{% endunless %}">
    {% if page.sidebar %}{% include author-profile.html %}{% endif %}
    <div class="content">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
</body>
</html>
